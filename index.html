<style>
:root{--bg:#0b1220;--bg2:#111c33;--card:#131f3a;--txt:#eef2ff;--mut:#93a0bb;--acc:#06b6d4;--acc2:#8b5cf6;--br:#263359;--ok:#22c55e}
*{box-sizing:border-box;font-family:Inter,"Segoe UI",Arial,sans-serif}
body{margin:0;background:radial-gradient(1000px 500px at 85% -5%,rgba(139,92,246,.25),transparent),radial-gradient(900px 500px at 5% 0%,rgba(6,182,212,.22),transparent),linear-gradient(180deg,#0b1220,#0b1220);color:var(--txt);min-height:100vh}

.brand{display:flex;gap:11px;align-items:center}
.mark{width:40px;height:40px;border-radius:11px;background:linear-gradient(135deg,#06b6d4,#8b5cf6);display:grid;place-items:center;font-weight:900;font-size:18px;color:#fff;box-shadow:0 4px 18px rgba(6,182,212,.4)}

.tag{font-size:12px;color:var(--mut)}
.search{flex:1;min-width:210px;display:flex}
.search input{flex:1;padding:10px 14px;border-radius:11px;border:1px solid var(--br);background:#0a1122;color:var(--txt);outline:none}
.search input:focus{border-color:var(--acc)}
.btn{border:1px solid var(--br);background:var(--bg2);color:var(--txt);padding:9px 14px;border-radius:10px;cursor:pointer;font-weight:700}
.btn:hover{border-color:var(--acc)}
.btn.primary{background:linear-gradient(90deg,#06b6d4,#8b5cf6);border:none;box-shadow:0 4px 16px rgba(139,92,246,.35)}
.layout{display:grid;grid-template-columns:300px 1fr;gap:14px;padding:14px;max-width:1400px;margin:auto}
@media(max-width:900px){.layout{grid-template-columns:1fr}}
.side{background:rgba(19,31,58,.9);border:1px solid var(--br);border-radius:14px;padding:12px;max-height:calc(100vh - 96px);overflow:auto}
.cat{font-weight:800;margin:12px 0 6px;color:#67e8f9;font-size:13px;text-transform:uppercase;letter-spacing:.5px}
.tool{display:block;width:100%;text-align:left;background:transparent;border:1px solid transparent;color:var(--txt);padding:8px 10px;border-radius:9px;cursor:pointer;font-size:14px}
.tool:hover{background:#0a1122}
.tool.active{background:linear-gradient(90deg,rgba(6,182,212,.22),rgba(139,92,246,.22));border-color:var(--acc)}
.main{background:rgba(19,31,58,.9);border:1px solid var(--br);border-radius:14px;padding:16px}
h2{margin:4px 0 2px;font-size:24px}.desc{color:var(--mut);font-size:14px;margin:0 0 10px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}

textarea:focus{border-color:var(--acc);outline:none}
.opts{background:#0a1122;border:1px solid var(--br);border-radius:12px;padding:10px;margin:10px 0;display:flex;gap:10px;flex-wrap:wrap;align-items:center}

.stats{display:flex;gap:14px;flex-wrap:wrap;color:var(--mut);font-size:13px;margin-top:8px}
.stats b{color:var(--txt)}
footer{text-align:center;color:var(--mut);padding:20px;font-size:13px;border-top:1px solid var(--br);margin-top:14px}
footer b{color:var(--txt)}
.badge{background:rgba(6,182,212,.14);border:1px solid var(--acc);border-radius:20px;padding:2px 10px;font-size:12px}

let cur='counter';
const $=id=>document.getElementById(id);
function renderSide(f=''){
const s=$('side');s.innerHTML='';
Object.keys(CATS).forEach(c=>{
const list=TOOLS.filter(t=>t.cat===c&&(t.en+' '+t.d).toLowerCase().includes(f.toLowerCase()));
if(!list.length)return;
s.innerHTML+=`<div class="cat">${CATS[c]} (${list.length})</div>`;
list.forEach(t=>{s.innerHTML+=`<button class="tool ${t.id===cur?'active':''}" onclick="select('${t.id}')">${t.en}</button>`});
});
}
function select(id){cur=id;const t=TOOLS.find(x=>x.id===id);
$('tTitle').textContent=t.en;
$('tDesc').textContent=t.d;$('tCat').textContent=CATS[t.cat];
$('opts').innerHTML=t.o||'<span style="color:var(--mut);font-size:13px">No options — paste text and press Run ⚡</span>';
renderSide($('q').value);updateStats();
if(['counter','freq','grammar','keys'].includes(id))runCurrent();
}
$('q').addEventListener('input',e=>renderSide(e.target.value));
$('inp').addEventListener('input',updateStats);
const val=id=>{const e=$(id);return e?e.value:''};
function updateStats(){const t=$('inp').value;
const w=(t.trim().match(/\S+/g)||[]).length;
$('stats').innerHTML=`Words: <b>${w}</b> | Characters: <b>${t.length}</b> | No spaces: <b>${t.replace(/\s/g,'').length}</b> | Lines: <b>${t?t.split('\n').length:0}</b> | Sentences: <b>${(t.match(/[^.!?]+[.!?]/g)||[]).length}</b> | Reading: <b>${Math.ceil(w/200)} min</b>`;}
function pasteIn(){navigator.clipboard.readText().then(x=>{$('inp').value=x;updateStats();});}
function clearAll(){$('inp').value='';$('out').value='';updateStats();}
function swapIO(){const a=$('inp').value;$('inp').value=$('out').value;$('out').value=a;updateStats();}
function loadSample(){$('inp').value='TextTools is a fast, private text toolkit that runs in your browser.\nContact us at hello@example.com or visit https://example.com\nThe price is 1,250,000. I love programming and I love coffee!';updateStats();runCurrent();}
function loadFile(e){const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{$('inp').value=r.result;updateStats();};r.readAsText(f);}
function copyOut(){$('out').select();document.execCommand('copy');navigator.clipboard.writeText($('out').value);}
function downloadOut(){const b=new Blob([$('out').value],{type:'text/plain;charset=utf-8'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='texttools-'+cur+'.txt';a.click();}
function toPDF(){const w=window.open('');w.document.write('<pre style="font-family:Arial;line-height:1.8;white-space:pre-wrap">'+$('out').value.replace(/</g,'&lt;')+'</pre>');w.print();}
function toggleTheme(){document.body.style.filter=document.body.style.filter?'':'invert(1) hue-rotate(180deg)';}
function openGTrans(){window.open('https://translate.google.com/?sl=auto&tl=en&text='+encodeURIComponent($('inp').value.slice(0,2000)),'_blank');}
const FLIP={'a':'ɐ','b':'q','c':'ɔ','d':'p','e':'ǝ','f':'ɟ','g':'ƃ','h':'ɥ','i':'ᴉ','j':'ɾ','k':'ʞ','l':'l','m':'ɯ','n':'u','o':'o','p':'d','q':'b','r':'ɹ','s':'s','t':'ʇ','u':'n','v':'ʌ','w':'ʍ','x':'x','y':'ʎ','z':'z','A':'∀','E':'Ǝ','H':'H','M':'W','T':'⊥','?':'¿','!':'¡','(' :')',')':'(','.':'˙',' ':' '};
const STOP=new Set('the,a,an,and,or,of,to,in,on,for,with,is,are,was,were,be,been,it,this,that,these,those,as,at,by,from,up,about,into,over,after,before,you,we,they,he,she,i'.split(','));
const SYN={'good':'excellent','big':'huge','small':'tiny','fast':'rapid','important':'crucial','happy':'joyful','love':'adore','use':'utilize','make':'create','help':'assist','show':'demonstrate','beautiful':'gorgeous','smart':'intelligent','idea':'concept','text':'content','tool':'utility','program':'application'};
function runCurrent(){
const t=$('inp').value;let o='';
const T=cur,g=id=>val(id);
try{
switch(T){
case 'counter':o=`Words: ${(t.trim().match(/\S+/g)||[]).length}\nCharacters: ${t.length}\nWithout spaces: ${t.replace(/\s/g,'').length}\nLines: ${t?t.split('\n').length:0}\nParagraphs: ${t.split(/\n\s*\n/).filter(x=>x.trim()).length}`;break;
case 'freq':{const m={};(t.toLowerCase().match(/[\p{L}\p{N}']+/gu)||[]).forEach(w=>m[w]=(m[w]||0)+1);o=Object.entries(m).sort((a,b)=>b[1]-a[1]).slice(0,100).map(([w,c])=>`${w}: ${c}`).join('\n')||'No words';break;}
case 'findrep':{let f=g('o1'),r=g('o2');if(!f){o='Type a search word';break;}if($('o4')&&$('o4').checked){o=t.replace(new RegExp(f,$('o3').checked?'g':'gi'),r);}else{o=t.replace(new RegExp(f.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),$('o3').checked?'g':'gi'),r);}break;}
case 'wrap':{const n=+g('o1')||80;o=t.split('\n').map(l=>{const w=l.split(/\s+/);let line='',res=[];w.forEach(x=>{if((line+' '+x).trim().length>n){res.push(line.trim());line=x;}else line+=' '+x;});res.push(line.trim());return res.join('\n');}).join('\n');break;}
